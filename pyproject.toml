[project]
name = "fqae"
version = "0.1.0"
description = "Football Quantitative Analytics Engine (research / paper trading)"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy>=1.26", "scipy>=1.11"]

[dependency-groups]
dev = ["pytest>=8", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
